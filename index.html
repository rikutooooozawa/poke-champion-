<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ポケチャン ダメ計＆対面ナビ</title><style>:root{--bg:#f3f4f8;--card:#fff;--ink:#1d2030;--sub:#6a6f85;--line:#e3e5ee;--acc:#4f5bd5;--g:#1f9d55;--y:#c98a00;--r:#d33a3a}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;padding-bottom:40px}
header{position:sticky;top:0;z-index:5;background:#1d2030;color:#fff;padding:10px 12px 0}
header h1{font-size:16px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.mode{display:flex;background:#33374d;border-radius:20px;padding:2px}
.mode button{border:0;background:none;color:#cfd2e6;padding:4px 12px;border-radius:18px;font-size:13px}
.mode button.on{background:#fff;color:#1d2030;font-weight:700}
.tabs{display:flex;gap:2px}
.tabs button{flex:1;border:0;background:none;color:#aeb2c9;padding:9px 0;font-size:14px;border-bottom:3px solid transparent}
.tabs button.on{color:#fff;border-color:#8f9aff;font-weight:700}
main{max-width:760px;margin:0 auto;padding:10px}
.card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.card.hl{border:2px solid var(--acc)}
h2{font-size:15px;margin:0 0 8px}h2 small{font-weight:400;color:var(--sub);font-size:12px}
h3{font-size:14px;margin:10px 0 6px;color:var(--acc)}
summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}
summary h2::before{content:"▸ ";color:var(--sub)}details[open] summary h2::before{content:"▾ "}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{border:1px solid var(--line);background:#fafbff;border-radius:16px;padding:6px 11px;font-size:13px;color:var(--ink)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.mon{background:#f7f8fc;border-radius:8px;padding:8px;margin-bottom:6px}
.mn{font-weight:700;font-size:15px}
.sub{color:var(--sub);font-size:12.5px}
.sub b{color:var(--ink)}
.tb{display:inline-block;color:#fff;font-size:11px;padding:0 6px;border-radius:4px;margin-left:3px;vertical-align:1px;font-weight:700}
select,input{font-size:16px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff;color:var(--ink);max-width:100%}
select.big,input.big{width:100%;margin-bottom:8px}
.hp{margin-top:8px}.hp label{font-size:13px}.hp input[type=range]{width:100%}
.qk{display:flex;gap:4px;flex-wrap:wrap}.qk button{border:1px solid var(--line);background:#fff;border-radius:6px;font-size:12px;padding:3px 7px}
.tg{display:inline-flex;align-items:center;gap:4px;font-size:13px;margin:4px 10px 4px 0}
.tg input{width:18px;height:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.grid2 label{font-size:12px;color:var(--sub);display:flex;flex-direction:column;gap:2px}
.tgs{margin:6px 0}
.rkw{display:grid;grid-template-columns:1fr;gap:6px;margin:6px 0}
.rk{display:inline-flex;flex-direction:column;font-size:11px;color:var(--sub);margin-right:4px}
.rk select{font-size:14px;padding:3px}
.badge{background:var(--y);color:#fff;font-size:11px;border-radius:8px;padding:1px 6px;font-weight:400}
.btn{border:0;background:var(--acc);color:#fff;border-radius:8px;padding:9px 14px;font-size:14px}.btn.sm{padding:5px 10px;font-size:12px;background:#8a90ad}
.adv{padding:7px 9px;border-radius:8px;margin:5px 0;font-size:14px;background:#f3f4f8}
.adv.good{background:#e3f6ea;color:#11643a;font-weight:700}
.adv.ok{background:#eef0ff}
.adv.warn{background:#fff5dd}
.adv.bad{background:#fde7e7;color:#8f1d1d;font-weight:700}
.adv.spd{background:#f7f8fc;font-size:13px}
.memo{margin:6px 0 0;padding-left:18px;font-size:12.5px;color:var(--sub)}
.mv{border-top:1px solid var(--line);padding:8px 0}
.mv:first-of-type{border-top:0}
.mv.st{color:var(--sub)}
.mt{font-weight:700}.mt small{font-weight:400;color:var(--sub)}
.row{margin:6px 0 2px;padding-left:2px}
.lb{display:inline-block;font-size:12px;background:#e8eaf6;border-radius:4px;padding:0 6px;margin-bottom:2px}
.nums{font-size:14px}.nums small{color:var(--sub)}
.ko{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:10px;padding:0 7px;margin-left:4px}
.e2{color:var(--r);font-weight:700;font-size:12px}.e4{color:#fff;background:var(--r);border-radius:4px;padding:0 4px;font-size:12px}.eh{color:#3f6fd0;font-size:12px}.e0{color:#888;font-size:12px}
.bar{position:relative;height:10px;background:#eceef5;border-radius:5px;overflow:hidden;margin:4px 0}
.bar .cur{position:absolute;left:0;top:0;bottom:0;background:#c9f0d6}
.bar .d2{position:absolute;left:0;top:0;bottom:0;background:#f2b8b8}
.bar .d1{position:absolute;left:0;top:0;bottom:0;background:var(--r)}
.zero{color:#888;font-size:13px}
.note{font-size:12px;color:var(--y);margin-top:2px}
.warn{color:var(--r)}
.g{color:var(--g)}.y{color:var(--y)}.r{color:var(--r)}
.tw{overflow-x:auto;margin:8px -4px}
table.cmp{border-collapse:collapse;width:100%;font-size:13px}
table.cmp th,table.cmp td{border:1px solid var(--line);padding:5px 4px;text-align:center}
table.cmp th{background:#f3f4f8;font-size:12px}
table.cmp td.nm{text-align:left;white-space:nowrap;font-size:12.5px}
table.cmp td small{font-size:10.5px;color:var(--sub)}
table.cmp td[data-act]{cursor:pointer}
table.cmp.sm td{font-size:15px;font-weight:700}
.s3{background:#d5f2df}.s2{background:#eef0ff}.s1{background:#fff5dd}.s0{background:#fde7e7}
.tot td{font-size:11.5px;background:#fafafa}
.ed h3{margin-top:0}
.pts{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.pts label{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--sub)}
.pts input{width:100%;text-align:center;padding:5px 2px}
.pts small{color:var(--ink);font-weight:700}
.help{padding-left:20px;margin:0}.help li{margin:4px 0}
@media(min-width:600px){.rkw{grid-template-columns:1fr 1fr}}

.pick{position:relative}
.pick .cur{font-size:13px;margin-bottom:4px}
.tag{display:inline-block;font-size:10.5px;background:#e3f6ea;color:#11643a;border-radius:6px;padding:0 5px;font-weight:700}
.plist{display:none;max-height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;margin:-4px 0 8px;background:#fff}
.plist.on{display:block}
.pi{display:flex;align-items:center;gap:2px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff;padding:9px 10px;font-size:15px;color:var(--ink)}
.pi span:first-child{margin-right:4px}
.pi:active{background:#eef0ff}
.pe{padding:8px 10px;font-size:12px;color:var(--sub)}
.grid2 .pick input{width:100%}
.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.grid2 label>input,.grid2 label>select,.grid2 label>.pick{width:100%;min-width:0}
.trow{display:flex;align-items:flex-start;gap:6px;margin-bottom:4px}
.trow .no{width:18px;padding-top:8px;color:var(--sub);font-size:13px}
.trow .grow{flex:1;min-width:0}.trow .grow input{width:100%;margin-bottom:4px}
.tg.sm{font-size:12px;margin:6px 0 0;white-space:nowrap}
.tabs button{font-size:13.5px}
.adv[data-act]{cursor:pointer}
.seg{display:flex;background:#eceef5;border-radius:10px;padding:3px;margin:8px 0 4px}
.seg button{flex:1;border:0;background:none;padding:7px 0;border-radius:8px;font-size:14px;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}

// 倒せる確率（残りHPから n回で）
function koProb(res,def,env,n){
 const maxHP=def.stats.H; let cur=Math.max(1,Math.floor(maxHP*env.hp[def.side]/100));
 if(env.hp[def.side]>=100) cur=maxHP;
 const sash=(def.item==='きあいのタスキ'||(def.ability==='がんじょう'&&res.attAb!=='かたやぶり'))&&cur===maxHP&&!res.multi;

 const chip=Math.floor(maxHP/8);
 let dist=new Map([[cur,1]]); let ko=0;
 for(let i=0;i<n;i++){
  const nd=new Map();
  for(const [hp,w] of dist){
   if(i===0&&disguise){
    let d=chip+(res.multi?res.per[0]*(res.hits-1):0);
    // 連続技の場合は2発目以降をロール平均で近似
    if(res.multi){const avg=res.per.reduce((a,b)=>a+b,0)/16;d=chip+Math.floor(avg*(res.hits-1));}
    const nh=hp-d; if(nh<=0) ko+=w; else nd.set(nh,(nd.get(nh)||0)+w); continue;
   }
   for(const d of res.dmg){
    let nh=hp-d;
    if(nh<=0&&sash&&hp===maxHP) nh=1;
    if(nh<=0) ko+=w/16; else nd.set(nh,(nd.get(nh)||0)+w/16);
   }
  }
  dist=nd;
  if(!dist.size) break;

  const p=koProb(res,def,env,n);

function analyze(me,opp,env0){
 const env=resolveField(me,opp,env0);
 const atk=me.moves.map(m=>{const r=calc(me,opp,m,env);if(r&&!r.unknown){r.attAb=me.ability;r.ko=koInfo(r,opp,env);}return r;}).filter(Boolean);
 const dfn=opp.moves.map(m=>{const r=calc(opp,me,m,env);if(r&&!r.unknown){r.attAb=opp.ability;r.ko=koInfo(r,me,env);}return r;}).filter(Boolean);
 const sMe=effSpeed(me,env), sOp=effSpeed(opp,env);
 const faster=(pA,pB)=>{ if(pA!==pB) return pA>pB?1:-1; if(sMe===sOp) return 0; return (env.tr?sMe<sOp:sMe>sOp)?1:-1; };
 const valid=a=>a.filter(r=>!r.unknown&&!r.zero&&r.dmg[15]>0);
 const avg=r=>r.dmg.reduce((a,b)=>a+b,0)/16;
 const oppAtk=valid(dfn).filter(r=>!MOVES[r.name].first||true);
 const oppBest=oppAtk.slice().sort((a,b)=>avg(b)-avg(a))[0];
 const myAtk=valid(atk);
 const myBest=myAtk.slice().sort((a,b)=>(b.ko.p1-a.ko.p1)||(avg(b)-avg(a)))[0];
 const myHPnow=Math.floor(me.stats.H*env.hp.me/100);
 const advice=[]; let score=0;
 const oppP=oppBest?oppBest.prio:0;
 const oppK1=oppBest?oppBest.ko.p1:0;
 // 先に倒せる技
 const firstKO=myAtk.filter(r=>r.ko.p1>0 && faster(r.prio,oppP)===1).sort((a,b)=>(b.ko.p1-a.ko.p1)||(b.prio-a.prio));
 const tieKO=myAtk.filter(r=>r.ko.p1>0 && faster(r.prio,oppP)===0);
 const mySpeedTxt=env.tr?'（トリックルーム中は遅い方が先）':'';
 if(firstKO.length&&firstKO[0].ko.p1>=0.9999){
  const r=firstKO[0];advice.push({lv:'good',t:`◎ 『${r.name}』で先に倒せます（確定）`});score=3;
 }else if(firstKO.length){
  const r=firstKO[0];advice.push({lv:'ok',t:`○ 『${r.name}』で先に倒せる可能性 ${Math.round(r.ko.p1*1000)/10}%`});score=2;
 }else if(tieKO.length){
  advice.push({lv:'ok',t:`△ 同速です。『${tieKO[0].name}』で倒せるかは先手を取れるか次第（50%）`});score=1;
 }
 if(score<3){
  // 相手が先に倒してくるか
  const oppFirst=oppBest?faster(myBest?myBest.prio:0,oppP)===-1:false;
  if(oppBest&&oppFirst&&oppK1>0){
   const surv=1-oppK1;
   const sashOnly=me.item==='きあいのタスキ'&&env.hp.me>=100&&oppBest.dmg[0]>=me.stats.H&&!oppBest.multi;
   if(myBest&&myBest.ko.p1>=0.9999&&surv>0&&sashOnly){
    advice.push({lv:'warn',t:`△ きあいのタスキで『${oppBest.name}』を耐えて『${myBest.name}』で倒せます（タスキ頼み。ステロ・連続技・ねこだましで崩れるので注意）`});
    score=Math.max(score,1);
   }else if(myBest&&myBest.ko.p1>=0.9999&&surv>0){
    advice.push({lv:surv>=0.9999?'ok':'warn',t:`${surv>=0.9999?'○':'△'} 相手の『${oppBest.name}』を${surv>=0.9999?'耐えて':'耐えれば（耐える確率'+Math.round(surv*1000)/10+'%）'}、『${myBest.name}』で倒せます`});
    score=Math.max(score,surv>=0.9999?2:1);
   }else if(score===0){
    advice.push({lv:'bad',t:`× 先に『${oppBest.name}』で倒される可能性 ${Math.round(oppK1*1000)/10}% → 交代がおすすめ`});
   }
  }
  if(score===0&&myBest){
   // 撃ち合い
   const myN=myBest.ko.n, opN=oppBest?oppBest.ko.n:9;
   const meFirst=faster(myBest.prio,oppP)>=0;
   const win=meFirst?myN<=opN:myN<opN;
   const sashExch=me.item==='きあいのタスキ'&&env.hp.me>=100&&oppBest&&oppBest.dmg[0]>=me.stats.H;
   if((!(oppBest&&oppFirst&&oppK1>0)||oppK1<0.5)&&!sashExch){
    if(win){advice.push({lv:'ok',t:`○ 撃ち合いは有利（自分『${myBest.name}』${myBest.ko.label} ／ 相手『${oppBest?oppBest.name:'-'}』${oppBest?oppBest.ko.label:'攻撃なし'}）`});score=2;}
    else{score=pct(myBest.dmg[0],opp)>=50?1:0;advice.push({lv:score?'warn':'bad',t:`${score?'△':'×'} 撃ち合いは不利（自分『${myBest.name}』${myBest.ko.label} ／ 相手『${oppBest?oppBest.name:'-'}』${oppBest?oppBest.ko.label:'-'}）${score?'':' → 交代を考えよう'}`});}
   }
  }
  if(!myBest) advice.push({lv:'bad',t:'× この相手にダメージを与えられる技がありません'});
 }
 // 積みのチャンス
 const setup=me.moves.find(m=>MOVES[m]&&MOVES[m].setup);
 if(setup&&(!oppBest||pct(oppBest.dmg[15],me)*2<env.hp.me)) advice.push({lv:'ok',t:`★ 相手の攻撃は2発耐えられるので『${setup}』を積むチャンス`});
 // 特性・道具メモ
 const memo=[];
 if(opp.ability==='マルチスケイル'&&env.hp.opp>=100) memo.push('相手はマルチスケイル：HP満タンだとダメージ半分');
 if(opp.ability==='ばけのかわ'&&env.disguise) memo.push('相手はばけのかわ：最初の1発はHP1/8だけ削れる');
 if(opp.item==='きあいのタスキ'&&env.hp.opp>=100) memo.push('相手はきあいのタスキ：満タンから1発では倒れない（連続技なら貫通）');
 if(opp.ability==='がんじょう'&&env.hp.opp>=100) memo.push('相手はがんじょう：満タンから1発では倒れない');
 if(me.item==='きあいのタスキ'&&env.hp.me>=100) memo.push('自分はきあいのタスキ：満タンなら1発は耐える');
 if(opp.ability==='テイルアーマー') memo.push('相手はテイルアーマー：自分の先制技が効かない');
 if(env.terrain==='サイコ'&&grounded(opp,env)) memo.push('サイコフィールド：地面にいる相手に先制技が効かない');
 if(me.ability==='いかく'&&!me.isMega&&(opp.ability==='まけんき'||opp.ability==='かちき')) memo.push(`注意：いかくで相手の${opp.ability}が発動する`);
 if(opp.ability==='シェルアーマー') memo.push('相手はシェルアーマー：急所に当たらない');
 if(me.ability==='ききかいひ') memo.push('自分はききかいひ：HPが半分を切ると引っ込む');
 if(opp.ability==='じきゅうりょく') memo.push('相手はじきゅうりょく：攻撃を受けるたびにぼうぎょ+1（2発目以降の物理は計算より減る）');
 if(me.moves.includes('きょけんとつげき')) memo.push('きょけんとつげき使用後は被ダメ2倍。倒しきれない時は注意');
 if(opp.item==='こだわりスカーフ') memo.push('相手はスカーフ想定：すばやさ×1.5で計算');
 if(opp.item==='ゴツゴツメット'||opp.ability==='さめはだ'||opp.ability==='てつのトゲ') memo.push('接触技を当てると自分も削られる');
 return {env,atk,dfn,sMe,sOp,advice,memo,score,myBest,oppBest};
}

function spdTxt(a,b,tr){if(a===b)return '<b>同速（運次第）</b>';const f=tr?a<b:a>b;return f?'<b class="g">自分が先</b>':'<b class="r">相手が先</b>';}
function hpSlider(key,label,val,b){const hp=Math.max(1,Math.floor(b.stats.H*val/100));return `<div class="hp"><label>${label}：<b>${val}%</b>（${val>=100?b.stats.H:hp}/${b.stats.H}）</label><input type="range" min="1" max="100" value="${val}" data-c="${key}" data-num="1"><div class="qk">${[100,75,50,33,25,10].map(v=>`<button data-act="hp" data-k="${key}" data-v="${v}">${v}%</button>`).join('')}</div></div>`;}
function dmgRow(x,def,label,env,side){
 const H=def.stats.H;
 if(x.zero) return `<div class="row"><span class="lb">${esc(label)}</span><span class="zero">${esc(x.zero)}</span></div>`;
 const lo=x.dmg[0],hi=x.dmg[15]; const pl=pctTxt(lo,def),ph=pctTxt(hi,def);
 const curHP=env.hp[side]>=100?H:Math.max(1,Math.floor(H*env.hp[side]/100));

function pairEval(pi,i,useMega,sp){
 const key=[pi,i,useMega,sp,state.mode,JSON.stringify(state.parties[pi].mons[i])].join('|');
 if(teamCache[key]) return teamCache[key];
 const m=state.parties[pi].mons[i]; const env=defaultEnv(state.mode);

function combos(arr,k){const out=[];const rec=(st,cur)=>{if(cur.length===k){out.push(cur.slice());return;}for(let x=st;x<arr.length;x++){cur.push(arr[x]);rec(x+1,cur);cur.pop();}};rec(0,[]);return out;}
function teamAnalysis(){
 const pi=state.party; const mons=state.parties[pi].mons; const T=state.team;
 const myIdx=mons.map((m,i)=>validMon(m)?i:-1).filter(i=>i>=0);
 const opps=T.opp.map((sp,j)=>({sp,j})).filter(o=>o.sp&&FORMS[o.sp]);
 const N=pickN();
 if(!myIdx.length||!opps.length) return null;
 // 評価表
 const ev={}; myIdx.forEach(i=>{ev[i]={};opps.forEach(o=>{const cv=r=>r?{mine:aggMine(r.ms),theirs:aggTheirs(r.ts)}:null;ev[i][o.j]={n:cv(pairEval(pi,i,false,o.sp)),m:hasStoneMon(mons[i])?cv(pairEval(pi,i,true,o.sp)):null};});});
 const best=(i,j,mega)=>{const e=ev[i][j];return (mega&&e.m)?e.m:e.n;};
 // 相手の選出予想：自分の6匹（メガは有利な方）への有利度
 const oppRank=opps.map(o=>{let sc=0,beat=0;myIdx.forEach(i=>{const e=ev[i][o.j];const th=Math.min(e.n.theirs,e.m?e.m.theirs:9);const mine=Math.max(e.n.mine,e.m?e.m.mine:-1);sc+=th-mine*0.5;if(th>=2)beat++;});return {...o,sc:sc+(T.seen[o.j]?100:0),beat};}).sort((a,b)=>b.sc-a.sc);
 const pred=oppRank.slice(0,Math.min(N,opps.length));
 // 自分の選出：組み合わせ×メガの選び方
 const forced=myIdx.filter(i=>T.mine[i]);
 let cands=combos(myIdx,Math.min(N,myIdx.length));
 if(forced.length) cands=cands.filter(c=>forced.every(f=>c.includes(f)));
 const results=[];
 for(const c of cands){
  const stones=c.filter(i=>hasStoneMon(mons[i]));
  for(const mg of [-1,...stones]){
   let v=0; const assign={};
   pred.forEach(o=>{let b=-1,bi=-1;c.forEach(i=>{const s=best(i,o.j,i===mg).mine;if(s>b){b=s;bi=i;}});v+=b*3;assign[o.j]={i:bi,s:b};
    let lose=0;c.forEach(i=>{if(best(i,o.j,i===mg).theirs>=2)lose++;});v-=lose*0.6;});
   opps.forEach(o=>{let b=-1;c.forEach(i=>{b=Math.max(b,best(i,o.j,i===mg).mine);});v+=b;});
   results.push({c,mg,v,assign});
  }
 }
 results.sort((a,b)=>b.v-a.v);
 const top=results[0];
 // 先発：予想相手への平均
 const leadN=state.mode==='single'?1:2;
 const lead=top?top.c.slice().sort((a,b)=>{const f=i=>pred.reduce((s,o)=>s+best(i,o.j,i===top.mg).mine-best(i,o.j,i===top.mg).theirs*0.5,0);return f(b)-f(a);}).slice(0,leadN):[];
 return {pi,mons,myIdx,opps,ev,best,oppRank,pred,top,alt:results.find(r=>r!==top&&r.c.join()!==top.c.join()),lead,N};
}

  <label>性格<select data-ed="nature" data-i="${i}">${Object.keys(NATURES).map(n=>`<option ${n===m.nature?'selected':''}>${n}</option>`).join('')}</select></label>
  <label>特性<input list="dlAb" data-ed="ability" data-i="${i}" value="${esc(m.ability||'')}"></label>
  <label>持ち物<select data-ed="item" data-i="${i}">${ITEMS.map(t=>`<option ${t===m.item?'selected':''}>${t}</option>`).join('')}</select></label></div>
  <div class="pts">${SK.map(k=>`<label>${k}<input type="number" min="0" max="32" inputmode="numeric" data-ed="pt" data-k="${k}" data-i="${i}" value="${+m.pts[k]||0}">${st?`<small>${st[k]}</small>`:''}</label>`).join('')}</div>
  <div class="sub ${sum>66?'warn':''}">能力ポイント合計 ${sum}/66${sum>66?'（多すぎます）':''}</div>
  <div class="grid2">${[0,1,2,3].map(j=>`<label>技${j+1}<input list="dlMv" data-ed="mv" data-j="${j}" data-i="${i}" value="${esc(m.moves[j]||'')}">${m.moves[j]&&!MOVES[m.moves[j]]?'<small class="warn">未登録</small>':''}</label>`).join('')}</div></section>`;
 }
 h+=`<datalist id="dlAb">${ALL_AB.map(a=>`<option value="${a}">`).join('')}</datalist><datalist id="dlMv">${Object.keys(MOVES).map(a=>`<option value="${a}">`).join('')}</datalist>`;
 h+=`<section class="card"><button class="btn" data-act="resetParty">このパーティーを初期状態に戻す</button></section>`;
 return h;
}
function renderHelp(){
 return `<section class="card"><h2>使い方</h2><ol class="help">
 <li><b>対面</b>：自分のポケモンと相手のポケモン・型を選ぶと、技ごとのダメージ（%）、何発で倒せるか、今の残りHPで倒せるか、おすすめ行動が出ます。</li>
 <li>相手の型が分からない時は「全部の型」を選ぶと、型ごとの結果を並べて比べられます。</li>
 <li>「相手の残りHP」を動かすと、その時点で倒せるか・倒れるかが変わります。</li>
 <li><b>比較</b>：登録した3つのパーティーが、よく見る相手にどれだけ戦えるかを一覧で比べられます。</li>
 <li><b>編集</b>：パーティーの持ち物・性格・能力ポイント・技を変えられます。</li></ol></section>
 <section class="card"><h2>計算の前提</h2><ul class="help">
 <li>レベル50。実数値は HP＝種族値＋75＋能力ポイント、その他＝（種族値＋20＋能力ポイント）×性格補正。</li>
 <li>乱数（85〜100%）の16通りすべてで計算しています。</li>
 <li>たべのこし・オボンなどの回復、ステルスロックなどの定数ダメージ、2発目以降のマルチスケイル解除などは考慮していません。</li>
 <li>相手の型は、ランクバトルのシーズンM-8のデータ（技・持ち物・性格・能力ポイントの採用率）をもとに作った「よくある型」です。リストの一番上が一番多い型です。実際の相手とは違うことがあります。</li><li>型が未登録のポケモンは、種族値から自動で作った仮の型（タイプ一致技のみ）で計算します。</li><li>チャンピオンズで追加された一部の新しい特性（メガソーラー、かんつうドリルなど）は効果がはっきりしないため、計算に入れていないものがあります。</li>
 <li>おすすめ行動は「相手は一番ダメージの大きい技を使う」と仮定した目安です。交代や読みまでは考えていません。</li></ul></section>`;
}

// ---------- イベント ----------
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-act],[data-tab],[data-mode]'); if(!t) return;
 if(t.dataset.tab){state.tab=t.dataset.tab;render();window.scrollTo(0,0);return;}
 if(t.dataset.mode){state.mode=t.dataset.mode;state.oppSp=null;state.setIdx=0;render();return;}
 const a=t.dataset.act, i=t.dataset.i;
 if(a==='party'){state.party=+i;state.meIdx=0;}
 else if(a==='me'){state.meIdx=+i;state.c.hpMe=100;}
 else if(a==='set'){state.setIdx=i==='all'?'all':+i;}
 else if(a==='hp'){state.c[t.dataset.k]=+t.dataset.v;}
 else if(a==='resetC'){const keep={hpMe:state.c.hpMe,hpOpp:state.c.hpOpp};state.c=Object.assign({weatherSel:'auto',terrainSel:'auto',crit:false,burnMe:false,burnOpp:false,wallMe:'',wallOpp:'',twMe:false,twOpp:false,tr:false,hhMe:false,hhOpp:false,popMe:false,popOpp:false,disguise:true,glaiveMe:false,glaiveOpp:false,hits:3,fainted:0,rkMe:zr(),rkOpp:zr()},keep);}
 else if(a==='pick'){const v=t.dataset.v;
  if(t.dataset.kind==='opp'){state.oppSp=v;state.setIdx=0;state.c.hpOpp=100;}
  else if(t.dataset.kind==='team'){state.team.opp[+i]=v;saveTeam();}
  else{const P=state.parties[state.editParty];const k=+i;while(P.mons.length<=k)P.mons.push(null);
   if(!P.mons[k])P.mons[k]={sp:'',nature:'まじめ',ability:'',item:'なし',pts:{H:0,A:0,B:0,C:0,D:0,S:0},moves:['','','','']};
   P.mons[k].sp=v;if(v)P.mons[k].ability=FORMS[v].ab;saveParties();cmpCache={};}}
 else if(a==='judge'){state.judge=t.dataset.v;try{localStorage.setItem('pchamp_judge',state.judge);}catch(e){}}
 else if(a==='clearTeam'){state.team={opp:['','','','','',''],seen:[0,0,0,0,0,0],mine:[0,0,0,0,0,0]};saveTeam();}
 else if(a==='cmpParty'){state.cmpParty=+i;}
 else if(a==='editParty'){state.editParty=+i;}
 else if(a==='goMatch'){state.party=+t.dataset.p;state.meIdx=+t.dataset.m;state.oppSp=t.dataset.sp;state.setIdx=getSets(t.dataset.sp,state.mode).length>1?'all':0;state.tab='match';state.c.hpMe=100;state.c.hpOpp=100;render();window.scrollTo(0,0);return;}
 else if(a==='resetParty'){const pi=state.editParty;state.parties[pi]=JSON.parse(JSON.stringify(DEFAULT_PARTIES[pi]));saveParties();cmpCache={};}
 else return;
 state.team=loadTeam();try{const j=localStorage.getItem('pchamp_judge');if(JUDGE[j])state.judge=j;}catch(e){}render();
});
document.addEventListener('toggle',e=>{if(e.target.dataset&&e.target.dataset.cond)state.condOpen=e.target.open;},true);
function onInput(e){
 const t=e.target;
 if(t.dataset.seen!=null&&e.type==='change'){state.team.seen[+t.dataset.seen]=t.checked?1:0;saveTeam();render();return;}
 if(t.dataset.mine!=null&&e.type==='change'){state.team.mine[+t.dataset.mine]=t.checked?1:0;saveTeam();render();return;}
 if(t.dataset.search){ if(e.type==='input'){const l=t.nextElementSibling;l.innerHTML=pickList(t.dataset.search,t.value,t.dataset.i);l.classList.add('on');} return; }
 if(t.dataset.c){const k=t.dataset.c;let v=t.type==='checkbox'?t.checked:t.value;if(t.dataset.num||k==='hits'||k==='fainted')v=+v;state.c[k]=v;if(e.type==='input'&&t.type==='range'){const lab=t.parentElement.querySelector('label b');if(lab)lab.textContent=v+'%';return;}render();return;}
 if(t.dataset.rk){state.c[t.dataset.rk][t.dataset.k]=+t.value;render();return;}
 if(t.dataset.mega){state.mega[megaKey(state.party,state.meIdx)]=t.checked;cmpCache={};render();return;}
 if(t.dataset.act==='oppSp'){state.oppSp=t.value;state.setIdx=0;state.c.hpOpp=100;render();return;}
 if(t.dataset.pn){state.parties[state.editParty].name=t.value;saveParties();return;}
 if(t.dataset.ed){
  const P=state.parties[state.editParty]; const i=+t.dataset.i;
  while(P.mons.length<=i)P.mons.push(null);
  if(!P.mons[i])P.mons[i]={sp:'',nature:'まじめ',ability:'',item:'なし',pts:{H:0,A:0,B:0,C:0,D:0,S:0},moves:['','','','']};
  const m=P.mons[i]; const f=t.dataset.ed;
  if(f==='sp'){m.sp=t.value;if(t.value)m.ability=FORMS[t.value].ab;}
  else if(f==='pt'){let v=Math.max(0,Math.min(32,parseInt(t.value)||0));m.pts[t.dataset.k]=v;}
  else if(f==='mv'){m.moves[+t.dataset.j]=t.value.trim();}
  else m[f]=t.value;
  saveParties();cmpCache={};
  if(e.type==='change') state.team=loadTeam();try{const j=localStorage.getItem('pchamp_judge');if(JUDGE[j])state.judge=j;}catch(e){}render();
 }
}
document.addEventListener('focusin',e=>{const t=e.target;if(t.dataset&&t.dataset.search){const l=t.nextElementSibling;l.innerHTML=pickList(t.dataset.search,t.dataset.search!=='opp'?'':t.value,t.dataset.i);l.classList.add('on');if(t.dataset.search!=='opp')t.select();}});
document.addEventListener('input',onInput);
document.addEventListener('change',onInput);
state.team=loadTeam();try{const j=localStorage.getItem('pchamp_judge');if(JUDGE[j])state.judge=j;}catch(e){}render();
</script></body></html>
